<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Analyzer</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);
            padding:20px;
        }

        .container{
            width:100%;
            max-width:700px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#5a189a;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
        }

        textarea{
            width:100%;
            height:150px;
            border:2px solid #d8b4fe;
            border-radius:12px;
            padding:15px;
            font-size:16px;
            resize:none;
            outline:none;
        }

        textarea:focus{
            border-color:#7c3aed;
        }

        button{
            margin-top:20px;
            padding:12px 30px;
            border:none;
            border-radius:10px;
            background:#7c3aed;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            background:#6d28d9;
        }

        .result{
            margin-top:25px;
            padding:20px;
            border-radius:12px;
            background:#f3e8ff;
        }

        .result h2{
            color:#5b21b6;
        }

        .emoji{
            font-size:50px;
            margin-top:10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎭 Emotion Analyzer</h1>
        <p class="subtitle">
            Enter any text and discover the detected emotion.
        </p>

        <form method="POST">
            {% csrf_token %}
            <textarea
                name="text"
                placeholder="Type your thoughts here..."></textarea>

            <button type="submit">Analyze Emotion</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Detected Emotion: {{ result }}</h2>

            {% if "Happy" in result %}
                <div class="emoji">😊</div>
            {% elif "Sad" in result %}
                <div class="emoji">😢</div>
            {% elif "Angry" in result %}
                <div class="emoji">😠</div>
            {% else %}
                <div class="emoji">😐</div>
            {% endif %}
        </div>
        {% endif %}
    </div>

</body>
</html>
